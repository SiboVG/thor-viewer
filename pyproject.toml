[project]
name = "thor-viewer"
version = "0.1.0"
description = "Open-source cross-platform viewer for the ThermalMaster Thor thermal camera"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pyside6",
    "thor-camera-driver",
    # Live temperatures on macOS read the camera over raw USB (pyusb)
    "thor-camera-driver[usb] ; sys_platform == 'darwin'",
]

[tool.uv.sources]
# Local checkout of https://github.com/SiboVG/thor-camera-driver; clone it
# next to this repo (or point this at PyPI once published).
thor-camera-driver = { path = "../thor-camera-driver", editable = true }

[dependency-groups]
build = [
    "pillow>=10.0",
    "pyinstaller>=6.0",
]

[project.scripts]
thor-viewer = "thor_viewer.app:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
